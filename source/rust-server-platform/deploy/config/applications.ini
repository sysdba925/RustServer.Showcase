[Defaults]
RepositoryOwner=sysdba925
InstallRoot=/opt/rustserver
HealthScheme=http
HealthHost=127.0.0.1
HealthPath=/health

[Application:RustServer.Updater]
Repository=RustServer.Updater
Directory=updater
Service=rustserver-updater
Entrypoint=RustServer.Updater.Api.dll
HealthPort=8080

[Application:RustServer.Control]
Repository=RustServer.Control
Directory=control
Service=rustserver-control
Entrypoint=RustServer.Control.Api.dll
HealthPort=5112

[Application:RustServer.Rcon]
Repository=RustServer.Rcon
Directory=rcon
Service=rustserver-rcon-grpc
Entrypoint=RustServer.Rcon.Grpc.dll
HealthPort=50052

[Application:RustServer.Versions]
Repository=RustServer.Versions
Directory=versions
Service=rustserver-versions
Entrypoint=RustServer.Versions.Api.dll
HealthPort=5113

[Application:RustServer.Plugins]
Repository=RustServer.Plugins
Directory=plugins
Service=rustserver-plugins
Entrypoint=RustServer.Plugins.dll
HealthPort=5114

[Application:RustServer.Snapshots]
Repository=RustServer.Snapshots
Directory=snapshots
Service=rustserver-snapshots
Entrypoint=RustServer.Snapshots.Api.dll
HealthPort=5115

[Application:RustServer.PluginCatalog]
Repository=RustServer.PluginCatalog
Directory=plugin-catalog
Service=rustserver-plugin-catalog
Entrypoint=RustServer.PluginCatalog.Api.dll
HealthPort=5116
InstallHook=provisioning/provision.sh
HealthPath=/health/ready

[Application:RustServer.Auth]
Repository=RustServer.Auth
Directory=auth
Service=rustserver-auth
Entrypoint=RustServer.Auth.dll
HealthPort=5286
HealthPath=/health/ready

[Application:RustServer.Web]
Type=StaticWeb
Repository=RustServer.Web
Directory=web
EntryFile=index.html
HealthPort=8081
HealthPath=/_rustserver/web-readiness
