# Production RustServer platform routing.
#
# This file is included from nginx's http context. The release marker is
# derived on every request from the resolved current-link target, so release
# activation never requires an Nginx reload.
map $realpath_root $rustserver_web_release {
    default "";
    ~^/opt/rustserver/web/releases/(?<rustserver_web_release_tag>v[0-9]+\.[0-9]+\.[0-9]+(?:-dev\.[0-9]+)?)$ $rustserver_web_release_tag;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/rustserver/web/current;
    autoindex off;

    location = / {
        root /opt/rustserver/landing;
        try_files /index.html =404;
    }

    # Readiness is intentionally exposed only on the loopback listener below.
    location = /_rustserver/web-readiness {
        return 404;
    }

    # Auth owns these public endpoints. proxy_pass has no URI component, so
    # Auth receives the original URI, including OAuth callback paths.
    location ~ ^/(?:login|login\.css|login\.js|admin|portal|signin-google|signin-steam)$ {
        proxy_pass http://127.0.0.1:5286;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:5286;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # This endpoint is only an Nginx auth_request subrequest. Auth checks the
    # existing Identity cookie and Admin role; it does not create another
    # authorization model in the proxy.
    location = /_rustserver/auth/authorize-admin {
        internal;
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:5286/api/auth/authorize/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Application-owned routes may be installed only through this root-owned
    # include point. The base server exposes the Admin auth_request endpoint;
    # every included snippet must explicitly apply it and proxy only to its
    # own non-public upstream. Do not add application routes directly here.
    include /etc/rustserver/nginx/applications.d/*.conf;

    # A bare API prefix must not become a Dashboard route.
    location = /control-api {
        return 404;
    }

    location ^~ /control-api/ {
        auth_request /_rustserver/auth/authorize-admin;
        proxy_pass http://127.0.0.1:5112/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /versions-api {
        return 404;
    }

    location ^~ /versions-api/ {
        auth_request /_rustserver/auth/authorize-admin;
        proxy_pass http://127.0.0.1:5113/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /plugins-api {
        return 404;
    }

    location ^~ /plugins-api/ {
        auth_request /_rustserver/auth/authorize-admin;
        proxy_pass http://127.0.0.1:5114/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /snapshots-api {
        return 404;
    }

    location ^~ /snapshots-api/ {
        auth_request /_rustserver/auth/authorize-admin;
        proxy_pass http://127.0.0.1:5115/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Dashboard is an administrator-only static application. Vite must
    # build assets with /dashboard/ as its base; this route does not rewrite
    # root-based builds to compensate for an incompatible release.
    location = /dashboard {
        auth_request /_rustserver/auth/authorize-admin;
        error_page 401 403 = @rustserver_dashboard_unauthorized;
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /dashboard/assets/ {
        auth_request /_rustserver/auth/authorize-admin;
        error_page 401 403 = @rustserver_dashboard_unauthorized;
        alias /opt/rustserver/web/current/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /dashboard/ {
        auth_request /_rustserver/auth/authorize-admin;
        error_page 401 403 = @rustserver_dashboard_unauthorized;
        try_files $uri $uri/ @rustserver_dashboard;
    }

    location @rustserver_dashboard {
        auth_request /_rustserver/auth/authorize-admin;
        error_page 401 403 = @rustserver_dashboard_unauthorized;
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location @rustserver_dashboard_unauthorized {
        return 302 /;
    }

    # The legacy index entrypoint and unknown paths have no application fallback.
    location = /index.html {
        return 404;
    }

    location / {
        return 404;
    }
}

server {
    # This port is the trusted Updater/Executor readiness origin. Do not add a
    # wildcard listener here: the release identity endpoint is local only.
    listen 127.0.0.1:8081;
    listen [::1]:8081;
    server_name localhost;

    root /opt/rustserver/web/current;
    autoindex off;

    location = /_rustserver/web-readiness {
        # $realpath_root follows current and only accepts a direct, valid
        # release directory. The existence check proves that Nginx can open the
        # actual entry file; this route never falls back to the SPA.
        if ($rustserver_web_release = "") {
            return 404;
        }

        if (!-f $document_root/index.html) {
            return 404;
        }

        add_header Cache-Control "no-store" always;
        add_header X-RustServer-Release $rustserver_web_release always;
        return 200;
    }

    location / {
        return 404;
    }
}
